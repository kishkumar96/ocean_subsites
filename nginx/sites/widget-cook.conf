upstream widget-cook {
    server plugin-widget-cook:80;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Widget Cook Islands route
    location /widget-cook {
        proxy_pass http://widget-cook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket connections for hot reload during development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fallback for static files in widget-cook
    location /widget-cook/static/ {
        proxy_pass http://widget-cook/static/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
